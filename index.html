<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrganizeOS - File Management Game</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      --panel-bg: rgba(30, 41, 59, 0.75);
      --panel-border: rgba(255, 255, 255, 0.12);
      --card-bg: rgba(51, 65, 85, 0.85);
      --card-border: rgba(255, 255, 255, 0.14);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --radius: 12px;
    }

    body.theme-young {
      --bg-gradient: radial-gradient(circle at 50% 0%, #312e81 0%, #0f172a 100%);
      --accent: #f472b6;
      --accent-hover: #ec4899;
      --accent-glow: rgba(244, 114, 182, 0.3);
      --radius: 18px;
    }

    body.theme-advanced {
      --bg-gradient: radial-gradient(circle at 50% 0%, #064e3b 0%, #022c22 100%);
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --font: var(--font-mono);
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .tier-group {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--panel-border);
      gap: 4px;
    }

    .tier-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: calc(var(--radius) - 4px);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .tier-pill:hover {
      color: #fff;
    }

    .tier-pill.active {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer
